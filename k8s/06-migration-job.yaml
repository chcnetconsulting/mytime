apiVersion: batch/v1
kind: Job
metadata:
  name: mytime-migrations
  namespace: mytime
  labels:
    app.kubernetes.io/name: mytime
    app.kubernetes.io/component: migrations
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mytime
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrations
          image: chcnetconsulting/mytime:2.0.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - bin/cake migrations migrate && bin/cake schema_cache clear && bin/cake cache clear_all
          envFrom:
            - configMapRef:
                name: mytime-config
            - secretRef:
                name: mytime-secret
          volumeMounts:
            - name: tmp
              mountPath: /var/www/html/tmp
            - name: logs
              mountPath: /var/www/html/logs
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
