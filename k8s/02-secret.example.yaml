apiVersion: v1
kind: Secret
metadata:
  name: mytime-secret
  namespace: mytime
type: Opaque
stringData:
  SECURITY_SALT: "change-me-to-a-long-random-string"
  # ⚠ ÜBERGANGSWEISE. Die Anwendung spricht seit Image 2.2.0 PostgreSQL
  # (pgsql92) — die Werte hier bedienen nur noch zwei Dinge: das StatefulSet
  # in 09-mysql.yaml und den einmaligen Import in 10-import-job.yaml.
  # Beim Abbau von mysql-0 ersatzlos entfernen. Das Passwort der neuen
  # Datenbank steht NICHT hier, sondern im Secret mytime-db
  # (11-db-secret.example.yaml).
  MYSQL_HOST: "mysql"
  MYSQL_USER: "mytime"
  MYSQL_PASS: "change-me"
  MYSQL_ROOT_PASSWORD: "change-me-root"
  MYSQL_DB: "mytime"
  ENTRA_TENANT_ID: "change-me"
  ENTRA_CLIENT_ID: "change-me"
  ENTRA_CLIENT_SECRET: "change-me"
  OIDC_OWNER_EMAIL: "owner@example.com"
  # REST-API (/api/*): Bearer-Token. Leer/weglassen = API deaktiviert.
  # Starkes Zufallstoken erzeugen, z. B.:  openssl rand -hex 32
  MYTIME_API_TOKEN: "change-me-to-a-long-random-token"
