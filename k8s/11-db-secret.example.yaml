# Das Datenbankpasswort fuer pgsql92. NICHT committen — der Wert wird
# imperativ aus dem Secret gesetzt, das der Zalando-Operator erzeugt:
#
#   PW=$(kubectl -n default get secret \
#          mytime.pgsql92.credentials.postgresql.acid.zalan.do \
#          -o jsonpath='{.data.password}' | base64 -d)
#   kubectl -n mytime create secret generic mytime-db --from-literal=DB_PASSWORD="$PW"
#
# Warum kopieren und nicht direkt einbinden: Secrets gelten nur in ihrem
# eigenen Namespace, und der Operator laeuft mit
# enable_cross_namespace_secret: false. Dasselbe Vorgehen wie bei wikijs
# (~/dev/infra/k8s/wikijs/).
#
# Warum ein eigenes Secret und nicht mytime-secret: dieser Wert stammt aus dem
# Operator, alle anderen werden von Hand gepflegt. Getrennt zu halten heisst,
# dass ein erneutes Kopieren die uebrigen Werte nicht anfassen kann.
#
# Aendert sich das Passwort (Rotation ist derzeit aus,
# enable_password_rotation: false), muss nach dem erneuten Kopieren
# zwingend `kubectl -n mytime rollout restart deploy/mytime` folgen —
# envFrom wird nicht im laufenden Betrieb nachgezogen.
---
apiVersion: v1
kind: Secret
metadata:
  name: mytime-db
  namespace: mytime
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE_ME_aus_dem_Operator-Secret"
