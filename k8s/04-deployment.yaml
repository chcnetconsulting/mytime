apiVersion: apps/v1
kind: Deployment
metadata:
  name: mytime
  namespace: mytime
  labels:
    app.kubernetes.io/name: mytime
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mytime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mytime
    spec:
      securityContext:
        fsGroup: 82
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: app-copy
          image: localhost:32000/mytime:2.2.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - cp -a /var/www/html/. /app && chown -R 82:82 /app /tmp-cake /logs-cake
          volumeMounts:
            - name: app
              mountPath: /app
            - name: tmp
              mountPath: /tmp-cake
            - name: logs
              mountPath: /logs-cake
      containers:
        - name: php-fpm
          image: localhost:32000/mytime:2.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: fpm
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: mytime-config
            - secretRef:
                name: mytime-secret
            # Passwort fuer pgsql92, aus dem Operator-Secret kopiert (11-db-secret.example.yaml).
            - secretRef:
                name: mytime-db
          volumeMounts:
            - name: app
              mountPath: /var/www/html
            - name: tmp
              mountPath: /var/www/html/tmp
            - name: logs
              mountPath: /var/www/html/logs
          readinessProbe:
            tcpSocket:
              port: fpm
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: fpm
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: app
              mountPath: /var/www/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: mytime.chcnet.at
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: mytime.chcnet.at
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: app
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: mytime-nginx
